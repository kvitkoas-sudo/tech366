<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дорожная карта — Товародвижение розница</title>
<style>
  :root{
    --bg:#eef1f5; --panel:#fff; --ink:#1f2a37; --muted:#6b7686;
    --grid:#e4e8ee; --grid2:#f0f3f7; --qline:#d4dae2; --today:#e0483d;
    --c-analysis:#d9e5ef; --c-dev:#f4dfbc; --c-test:#d9efdf; --c-done:#1a73e8;
    --e-analysis:#2e6da4; --e-dev:#d88a0a; --e-test:#3fa85a;
    --shadow:0 1px 3px rgba(20,30,50,.08),0 8px 22px rgba(20,30,50,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  body{height:100vh;overflow:hidden}
  .page{max-width:1600px;margin:0 auto;padding:26px 22px 0;height:100vh;display:flex;flex-direction:column;min-height:0}
  h1{font-size:24px;margin:0;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:13px;margin:3px 0 0;max-width:1050px}
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 6px}
  .card{background:var(--panel);border-radius:11px;box-shadow:var(--shadow);padding:11px 15px;min-width:130px}
  .card .n{font-size:21px;font-weight:700;line-height:1}
  .card .l{font-size:11px;color:var(--muted);margin-top:4px}
  .card.warn .n{color:var(--today)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin:16px 0 14px}
  .legend .it{display:inline-flex;align-items:center;gap:7px}
  .sw{width:34px;height:13px;border-radius:4px;display:inline-block}
  .sw.grad{background:linear-gradient(90deg,var(--c-analysis) 0%,var(--c-analysis) 30%,var(--c-dev) 50%,var(--c-dev) 65%,var(--c-test) 85%,var(--c-test) 100%)}
  .sw.done{background:var(--c-done)}
  .todaymark{width:2px;height:15px;background:var(--today);display:inline-block;border-radius:2px}

  .chartwrap{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .chart{overflow:auto;flex:1 1 auto;min-height:0}
  .inner{position:relative;min-width:1400px;--gutter:396px}

  .qrow{display:flex;height:26px;border-bottom:1px solid var(--grid);background:var(--panel);position:sticky;top:0;z-index:12}
  .morow{display:flex;height:28px;border-bottom:1px solid var(--grid);background:var(--panel);position:sticky;top:26px;z-index:12}
  .qrow .gutcell,.morow .gutcell{z-index:14}
  .gutcell{flex:0 0 var(--gutter,330px);width:var(--gutter,330px);max-width:var(--gutter,330px);box-sizing:border-box;background:var(--panel);position:sticky;left:0;z-index:9;border-right:1px solid var(--grid);
    display:flex;align-items:center;padding:0 14px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;overflow:hidden}
  .qtl,.motl{position:relative;flex:1}
  .q{position:absolute;top:0;height:26px;display:flex;align-items:center;justify-content:flex-start;
    font-size:12px;font-weight:700;color:#3a4757;border-left:2px solid var(--qline);padding-left:8px;overflow:hidden;white-space:nowrap;box-sizing:border-box}
  .q:first-child{border-left:none}
  .mo{position:absolute;top:0;height:28px;display:flex;align-items:center;justify-content:flex-start;
    font-size:11px;color:#6b7686;border-left:1px solid var(--grid);padding-left:6px;overflow:hidden;white-space:nowrap;box-sizing:border-box}

  .rows{position:relative}
  .grow{display:flex;align-items:stretch;height:78px;border-bottom:1px solid var(--grid2)}
  .grow:nth-child(odd){background:#fbfcfe}
  .grow:hover{background:#f6f9fc}
  .lbl{flex:0 0 var(--gutter,330px);width:var(--gutter,330px);max-width:var(--gutter,330px);min-width:0;box-sizing:border-box;
    display:flex;flex-direction:row;align-items:stretch;gap:8px;padding:8px 12px;overflow:hidden;
    border-right:1px solid var(--grid);position:sticky;left:0;background:inherit;z-index:3}
  .lbl-col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px;min-height:62px}
  .tmeta{font-size:11px;color:#4a5563;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .rank{flex:0 0 20px;text-align:center;font-size:10px;font-weight:700;color:#98a2b0;line-height:1.4}
  .code{flex:0 0 auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;font-weight:700;color:#3a4757;background:#eef1f5;padding:1px 6px;border-radius:5px;white-space:nowrap;text-decoration:none;transition:background .12s,color .12s;margin-top:1px}
  a.code:hover{background:#d7e3f2;color:#1b4f8f;text-decoration:underline}
  .code{cursor:pointer}
  .code:hover{background:#d7e3f2;color:#1b4f8f}
  .tname{cursor:pointer}
  .tmeta{cursor:pointer}
  .tname:hover{color:#1b4f8f}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#2a3542;color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .tname{flex:1 1 auto;min-width:0;font-size:11.5px;line-height:1.2;color:#2a3542;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    white-space:normal;word-break:break-word}
  .track{position:relative;flex:1 1 auto;min-width:0}
  .bar{position:absolute;top:24px;height:30px;border-radius:6px;overflow:hidden}
  /* цельная полоса задачи: контейнер со всеми этапами; контур/скругление/штриховка — на нём */
  .taskbar{position:absolute;top:24px;height:30px;border-radius:6px;overflow:hidden;
    border:1px solid #2e6da4;box-sizing:border-box}
  .taskbar .seg-bar,.taskbar .gap-bar{top:0;height:100%;border:0 !important;border-radius:0;box-shadow:none !important}
  .taskbar .seg-bar.kuc{border:0 !important;box-shadow:none !important}
  /* выполненная задача: один слой штриховки поверх всей полосы */
  .taskbar.done::after{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
    background:repeating-linear-gradient(45deg,rgba(90,110,140,.30),rgba(90,110,140,.30) 3px,rgba(90,110,140,0) 3px,rgba(90,110,140,0) 7px)}
  .seg-bar{position:absolute;top:24px;height:30px;border-radius:0;display:flex;align-items:center;overflow:hidden;transition:box-shadow .15s,border-color .15s}
  .gap-bar{position:absolute;top:24px;height:30px;border-radius:0;display:flex;align-items:center;justify-content:center;
    background:repeating-linear-gradient(45deg,#eef0f3,#eef0f3 5px,#e4e7ec 5px,#e4e7ec 10px);
    border:1px dashed #c3c9d2;overflow:hidden;z-index:0}
  .gap-bar span{font-size:9px;color:#8a93a0;white-space:nowrap;padding:0 5px;font-style:italic}
  .gap-bar.weekend{background:#eef0f3;border:1px solid #e2e6ec}
  .gap-bar.weekend span{display:none}
  .gap-bar.vac{background:repeating-linear-gradient(45deg,#fde8dd,#fde8dd 5px,#f9dccb 5px,#f9dccb 10px);border-color:#e6a884}
  .gap-bar.vac span{color:#b5714a}
  .gap-bar.vacpause{background:#fdeadf;border:1px solid #efc4a6}
  .gap-bar.vacpause span{color:#b5714a;font-style:normal}
  .gap-bar.wait{background:repeating-linear-gradient(45deg,#f0f2f5,#f0f2f5 5px,#e7eaef 5px,#e7eaef 10px);border:1px dashed #cfd5dd}
  .gap-bar.pause{background:#eef0f3;border:1px solid #aeb6c2}
  /* штриховка отпуска поверх стадии, только дни пересечения */
  .vac-overlay{position:absolute;top:24px;height:30px;border-radius:2px;pointer-events:auto;z-index:3;
    background:repeating-linear-gradient(45deg,rgba(229,120,60,.55),rgba(229,120,60,.55) 3px,rgba(255,255,255,.15) 3px,rgba(255,255,255,.15) 6px);
    outline:1px solid rgba(197,90,40,.65)}
  /* задачи без дат — строка без полосок */
  .grow.undated{opacity:.9}
  .grow.undated .track{background:transparent}
  .noplan{position:absolute;left:6px;top:30px;font-size:10px;color:#9aa4b2;font-style:italic;
    background:#f1f3f6;border:1px dashed #d3d9e0;border-radius:4px;padding:1px 8px}
  .highlight-kuc .seg-bar.kuc{background:#e8890c !important;border:1.5px solid #9a5a00;box-shadow:0 0 0 2px rgba(232,137,12,.35),0 1px 3px rgba(154,90,0,.4);height:22px;top:9px}
  .highlight-kuc .seg-bar.kuc .seg-cap{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
  .highlight-kuc .grow:has(.seg-bar.kuc){background:#fff7ec}
  /* внутри цельной полосы куцеповский сегмент — на всю высоту контейнера */
  .taskbar .seg-bar.kuc{height:100% !important;top:0 !important}
  .grow.done-row .lbl{opacity:.72}
  .grow.done-row .code{background:#dfe3e9;color:#7a848f}
  .seg-cap{font-size:9.5px;font-weight:600;color:#2a3542;padding:0 5px;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.35)}
  .rlabel{position:absolute;top:12px;font-size:10px;font-weight:600;color:#5a6673;white-space:nowrap;pointer-events:none}
  .toggle .switch{width:34px;height:18px;border-radius:20px;background:#c7ccd4;position:relative;transition:background .18s;flex:0 0 auto}
  .toggle .knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .18s}
  .toggle input:checked + .switch{background:#e8890c}
  .toggle input:checked + .switch .knob{left:18px}
  .bar.done{background:var(--c-done)}
  .bar.done::after{content:'✓';position:absolute;right:6px;top:2px;color:#fff;font-size:11px;font-weight:700}
  .today{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:5;pointer-events:none}
  .today .flag{position:absolute;top:-1px;left:0;transform:translateX(-42%);background:var(--today);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap}
  .qgrid{position:absolute;top:0;bottom:0;width:2px;background:var(--qline);opacity:.5;z-index:0;pointer-events:none}
  .foot{height:10px;flex:0 0 10px}
  .tip{position:fixed;z-index:50;background:#f4f8fc;color:#2a3542;font-size:12px;padding:9px 12px;border-radius:8px;max-width:340px;border:1px solid #c9d9e8;box-shadow:0 8px 24px rgba(46,109,164,.18);pointer-events:none;opacity:0;transition:opacity .12s;line-height:1.45}
  .tip b{color:#b06d00}
  .tip .seg{color:#5f7488}
  @media print{body,.page{background:#fff}.chart{overflow:visible}.inner{min-width:0}}
  /* P4 — модальный редактор задачи */
  .edit-btn{font-size:12px;padding:4px 12px;border:1px solid #2e6da4;border-radius:6px;background:#2e6da4;color:#fff;cursor:pointer;font-weight:600}
  .edit-btn:hover{background:#255c8a}
  .modal-bg{position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:100;display:none;align-items:center;justify-content:center}
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(20,30,50,.35);width:560px;max-width:94vw;max-height:90vh;overflow:auto;padding:20px 22px}
  .modal h3{margin:0 0 2px;font-size:17px}
  .modal .jk{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#6b7686;margin-bottom:14px}
  .modal .fld{margin-bottom:11px}
  .modal .fld>label{display:block;font-size:11px;font-weight:600;color:#5a6673;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .modal input,.modal select{font-size:13px;padding:5px 8px;border:1px solid #c3c9d2;border-radius:6px;background:#fff;color:#2a3542;width:100%;box-sizing:border-box}
  .modal .stage-row{display:grid;grid-template-columns:90px 1fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:7px}
  .modal .stage-row .sh{font-size:12px;font-weight:600;color:#3a4757}
  .modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal .acts{display:flex;justify-content:space-between;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid #e4e8ee}
  .modal .btn{font-size:13px;padding:7px 16px;border-radius:7px;cursor:pointer;font-weight:600;border:1px solid transparent}
  .btn.apply{background:#2e6da4;color:#fff;border-color:#2e6da4}
  .btn.apply:hover{background:#255c8a}
  .btn.cancel{background:#eef1f5;color:#3a4757;border-color:#d5dbe3}
  .btn.cancel:hover{background:#e2e7ee}
</style>
</head>
<body>
<div class="page">
  <h1>Дорожная карта и ресурсный план команды «Товародвижение розница»</h1>

  <div class="cards">
    <div class="card"><div class="n" id="cardTeam">—</div><div class="l">аналитика · разработчика</div></div>
    <div class="card"><div class="n" id="cardTaskCount">—</div><div class="l" id="cardTaskLabel">задач в этом плане</div></div>
    <div class="card warn"><div class="n" id="cardHorizon">—</div><div class="l">горизонт плана</div></div>
  </div>

  <div class="legend">
    <span class="it"><span class="sw" style="background:var(--c-analysis);border:1px solid var(--e-analysis)"></span>Анализ</span>
    <span class="it"><span class="sw" style="background:var(--c-dev);border:1px solid var(--e-dev)"></span>Разработка</span>
    <span class="it"><span class="sw" style="background:var(--c-test);border:1px solid var(--e-test)"></span>Тестирование</span>
    <span class="it"><span class="todaymark"></span>Сегодня&nbsp;(<span id="todayLabel"></span>)</span>
    <span class="it"><span class="sw" style="background:repeating-linear-gradient(45deg,#6aa84f,#6aa84f 3px,#ffffff 3px,#ffffff 6px);border:1px solid #4f8038"></span>Реализовано</span>
    <span class="it"><span class="sw" style="background:repeating-linear-gradient(45deg,#eef0f3,#eef0f3 3px,#e4e7ec 3px,#e4e7ec 6px);border:1px dashed #c3c9d2"></span>Пауза (очередь / ожидание)</span>
    <label class="it toggle" style="margin-left:8px;cursor:pointer;user-select:none">
      <input type="checkbox" id="kucToggle" style="display:none">
      <span class="switch"><span class="knob"></span></span>
      <span>Выделить задачи Куцепалова <span style="color:#9a5a00;font-weight:600">(аутстафф «Ракета»)</span></span>
    </label>
    <label class="it" style="margin-left:8px;gap:6px">
      🏢 <span>Заказчик:</span>
      <select id="custFilter" style="font-size:12px;padding:3px 8px;border:1px solid #c3c9d2;border-radius:6px;background:#fff;color:#2a3542;cursor:pointer">
        <option value="">Все</option>
      </select>
    </label>
    <label class="it" style="margin-left:8px;gap:6px">
      🔎 <input type="text" id="searchFilter" placeholder="Поиск: код или название" style="font-size:12px;padding:3px 8px;border:1px solid #c3c9d2;border-radius:6px;background:#fff;color:#2a3542;width:200px">
    </label>
    <label class="it" style="margin-left:8px;gap:6px">
      👤 <span>Исполнитель:</span>
      <select id="whoFilter" style="font-size:12px;padding:3px 8px;border:1px solid #c3c9d2;border-radius:6px;background:#fff;color:#2a3542;cursor:pointer">
        <option value="">Все</option>
      </select>
    </label>
    <label class="it toggle" style="margin-left:8px;cursor:pointer;user-select:none">
      <input type="checkbox" id="hideDone" checked style="display:none">
      <span class="switch"><span class="knob"></span></span>
      <span>Скрыть реализованные</span>
    </label>
    <button id="saveCsvBtn" class="edit-btn" style="margin-left:auto">💾 Сохранить в CSV</button>
  </div>

  <div class="chartwrap"><div class="chart"><div class="inner" id="inner"></div></div></div>
  <div class="foot"></div>

</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3 id="emName">—</h3>
    <div class="jk" id="emJira">—</div>
    <div class="grid2">
      <div class="fld"><label>Статус</label>
        <select id="emStatus">
          <option value="В очереди">В очереди</option>
          <option value="Анализ">Анализ</option>
          <option value="Разработка">Разработка</option>
          <option value="Реализовано">Реализовано</option>
        </select>
      </div>
      <div class="fld"><label>Заказчики (через запятую)</label>
        <input type="text" id="emCustomers" placeholder="Михалёва, Козырева">
      </div>
    </div>
    <div class="fld"><label>Трудоёмкость, ч (анализ / разработка / тест)</label>
      <div class="grid2" style="grid-template-columns:1fr 1fr 1fr">
        <input type="number" id="emHa" min="0" placeholder="анализ">
        <input type="number" id="emHd" min="0" placeholder="разработка">
        <input type="number" id="emHt" min="0" placeholder="тест">
      </div>
    </div>
    <div class="fld"><label>Этапы: исполнитель · начало · конец</label>
      <div class="stage-row"><span class="sh">Анализ</span>
        <select id="emAw"></select><input type="date" id="emAs"><input type="date" id="emAe"></div>
      <div class="stage-row"><span class="sh">Разработка</span>
        <select id="emDw"></select><input type="date" id="emDs"><input type="date" id="emDe"></div>
      <div class="stage-row"><span class="sh">Тест</span>
        <select id="emTw"></select><input type="date" id="emTs"><input type="date" id="emTe"></div>
    </div>
    <div class="acts">
      <button class="btn cancel" id="emCancel">Отмена</button>
      <button class="btn apply" id="emApply">Применить</button>
    </div>
  </div>
</div>

<script>
const BASE='https://raw.githubusercontent.com/kvitkoas-sudo/tech366/main/road-map-2026/';
const FILES={tasks:'tasks.csv',resources:'resources.csv'};

// --- разбор CSV: ';', BOM, кавычки ---
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===';'){ row.push(cur);cur=''; }
    else if(c==='\n'){ row.push(cur);cur='';rows.push(row);row=[]; }
    else if(c!=='\r') cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur);rows.push(row); }
  if(!rows.length) return [];
  const hdr=rows[0].map(s=>s.trim());
  return rows.slice(1).filter(r=>r.some(x=>x!==''))
             .map(r=>Object.fromEntries(hdr.map((k,i)=>[k,(r[i]||'').trim()])));
}
// ДД.ММ.ГГГГ или ISO -> ISO YYYY-MM-DD
function toISO(s){
  s=(s||'').trim(); if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return s;
}
function excl(iso){const x=new Date(iso);x.setDate(x.getDate()+1);return x.toISOString().slice(0,10);}
function eachWorkOrAll(a,b){ // список ISO-дней [a..b] включительно
  const out=[];let x=new Date(a);const e=new Date(b);
  while(x<=e){ out.push(x.toISOString().slice(0,10)); x.setDate(x.getDate()+1); }
  return out;
}

async function loadData(){
  const bust='?t='+Date.now();
  const [tRaw,rRaw]=await Promise.all(
    ['tasks','resources'].map(k=>
      fetch(BASE+FILES[k]+bust).then(r=>{
        if(!r.ok) throw new Error(FILES[k]+': HTTP '+r.status);
        return r.text();
      })));
  const tasks=parseCSV(tRaw), res=parseCSV(rRaw);
  // сохраняем сырые данные и порядок колонок для редактора/выгрузки CSV
  window.__COLS = (function(){
    const m=tRaw.replace(/^\uFEFF/,'').split(/\r?\n/)[0]; return m.split(';').map(s=>s.trim());
  })();
  window.__RAW = tasks;      // массив объектов-строк (ссылки живут, правим их)
  window.__RES = res;

  return buildD(tasks,res);
}

// Сборка структуры D из сырых строк задач и ресурсов (переиспользуется после редактирования)
function buildD(tasks,res){
  const shortOf={}, vac={};
  res.forEach(r=>{
    shortOf[r.fio]=r.short||String(r.fio).split(' ')[0];
    if(r.vacation_start&&r.vacation_end) vac[r.fio]=[toISO(r.vacation_start),toISO(r.vacation_end)];
  });

  function vacOverlap(who,s,e){
    const v=vac[who]; if(!v) return null;
    const a=s>v[0]?s:v[0], b=e<v[1]?e:v[1];
    if(a>b) return null;
    return [a,excl(b)];
  }

  const plan=tasks.map(t=>{
    const seg={}; let hasDates=false;
    ['analysis','dev','test'].forEach(k=>{
      const s=toISO(t[k+'_start']), e=toISO(t[k+'_end']), w=t[k+'_who'];
      if(s&&e){ seg[k]=[s,excl(e),w,shortOf[w]||String(w).split(' ')[0],e]; hasDates=true; }
    });
    const gaps=[];
    Object.keys(seg).forEach(k=>{
      const ov=vacOverlap(seg[k][2],seg[k][0],seg[k][4]);
      if(ov) gaps.push([ov[0],ov[1],'Отпуск '+seg[k][2],'vac']);
    });
    const o={jira:t.jira,name:t.name,status:t.status,score:+t.score||0,
      seg:seg,hasDates:hasDates,
      fixed:t.fixed==='1',hatch:t.hatch==='1',
      who:[...new Set([t.analysis_who,t.dev_who,t.test_who].map(x=>(x||'').trim()).filter(Boolean))],
      customers:(t.customers||'').split(',').map(s=>s.trim()).filter(Boolean),
      _raw:t};
    if(hasDates){
      const alls=Object.values(seg).flatMap(v=>[v[0],v[4]]);
      o.start=alls.reduce((a,b)=>a<b?a:b);
      o.disp_end=alls.reduce((a,b)=>a>b?a:b);
      o.end=excl(o.disp_end);
    }
    if(gaps.length) o.gaps=gaps;
    return o;
  });

  const doneT=plan.filter(t=>t.hasDates && t.hatch).sort((a,b)=> a.start.localeCompare(b.start));
  const activeT=plan.filter(t=>t.hasDates && !t.hatch).sort((a,b)=> a.start.localeCompare(b.start));
  const undated=plan.filter(t=>!t.hasDates).sort((a,b)=> b.score-a.score);

  return {plan:doneT.concat(activeT,undated),done:[],resources:res,vac:vac};
}

}

function isoToInput(s){ // ДД.ММ.ГГГГ или ISO -> ГГГГ-ММ-ДД для <input type=date>
  s=(s||'').trim(); if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  return m? m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0') : '';
}
function inputToRu(s){ // ГГГГ-ММ-ДД -> ДД.ММ.ГГГГ для CSV
  s=(s||'').trim(); if(!s) return '';
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m? m[3]+'.'+m[2]+'.'+m[1] : s;
}
let __editingRaw=null;   // ссылка на редактируемую строку из window.__RAW

function fillWhoSelect(sel, current){
  sel.innerHTML='';
  const opts=new Set(['']);
  (window.__RAW||[]).forEach(t=>{ ['analysis_who','dev_who','test_who'].forEach(k=>{ const v=(t[k]||'').trim(); if(v) opts.add(v); }); });
  if(current) opts.add(current);
  [...opts].sort((a,b)=>a.localeCompare(b,'ru')).forEach(v=>{
    const o=document.createElement('option'); o.value=v; o.textContent=v||'—'; if(v===(current||'')) o.selected=true; sel.appendChild(o);
  });
}

function openEditor(raw){
  __editingRaw=raw;
  document.getElementById('emName').textContent=raw.name||'';
  document.getElementById('emJira').textContent=raw.jira||'';
  const st=document.getElementById('emStatus'); st.value=raw.status||'В очереди';
  document.getElementById('emCustomers').value=raw.customers||'';
  document.getElementById('emHa').value=raw.hours_analysis||'';
  document.getElementById('emHd').value=raw.hours_dev||'';
  document.getElementById('emHt').value=raw.hours_test||'';
  fillWhoSelect(document.getElementById('emAw'), (raw.analysis_who||'').trim());
  fillWhoSelect(document.getElementById('emDw'), (raw.dev_who||'').trim());
  fillWhoSelect(document.getElementById('emTw'), (raw.test_who||'').trim());
  document.getElementById('emAs').value=isoToInput(raw.analysis_start);
  document.getElementById('emAe').value=isoToInput(raw.analysis_end);
  document.getElementById('emDs').value=isoToInput(raw.dev_start);
  document.getElementById('emDe').value=isoToInput(raw.dev_end);
  document.getElementById('emTs').value=isoToInput(raw.test_start);
  document.getElementById('emTe').value=isoToInput(raw.test_end);
  document.getElementById('editModal').classList.add('open');
}
function closeEditor(){ document.getElementById('editModal').classList.remove('open'); __editingRaw=null; }

function applyEditor(){
  const r=__editingRaw; if(!r) return;
  r.status=document.getElementById('emStatus').value;
  r.customers=document.getElementById('emCustomers').value.trim();
  r.hours_analysis=document.getElementById('emHa').value.trim();
  r.hours_dev=document.getElementById('emHd').value.trim();
  r.hours_test=document.getElementById('emHt').value.trim();
  r.analysis_who=document.getElementById('emAw').value;
  r.dev_who=document.getElementById('emDw').value;
  r.test_who=document.getElementById('emTw').value;
  r.analysis_start=inputToRu(document.getElementById('emAs').value);
  r.analysis_end  =inputToRu(document.getElementById('emAe').value);
  r.dev_start     =inputToRu(document.getElementById('emDs').value);
  r.dev_end       =inputToRu(document.getElementById('emDe').value);
  r.test_start    =inputToRu(document.getElementById('emTs').value);
  r.test_end      =inputToRu(document.getElementById('emTe').value);
  // авто-hatch: статус «Реализовано» -> 1, иначе 0
  r.hatch = (r.status==='Реализовано') ? '1' : '0';
  closeEditor();
  // пересобрать и перерисовать карту
  const D=buildD(window.__RAW, window.__RES);
  render(D);
}

function csvEscape(v){ v=(v==null?'':String(v)); return /[;"\n\r]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
function saveCsv(){
  const cols=window.__COLS||[]; const rows=window.__RAW||[];
  const lines=[cols.join(';')];
  rows.forEach(r=>lines.push(cols.map(c=>csvEscape(r[c])).join(';')));
  const text='\uFEFF'+lines.join('\r\n')+'\r\n';   // BOM + CRLF
  const blob=new Blob([text],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='tasks.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// делегирование кликов: полоса/название/даты -> редактор; код -> копировать ссылку
const JIRA_BASE='https://jira.366.ru/browse/';
function showToast(msg){
  const t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'),1600);
}
function openEditorByCode(code){
  const raw=(window.__RAW||[]).find(t=>t.jira===code);
  if(raw) openEditor(raw);
}
document.addEventListener('click',function(ev){
  const tgt=ev.target;
  // код -> копировать ссылку в буфер (не открывает редактор)
  const codeEl=tgt.closest && tgt.closest('.code[data-jira]');
  if(codeEl){
    const url=JIRA_BASE+encodeURIComponent(codeEl.dataset.jira);
    const done=()=>showToast('Ссылка скопирована: '+codeEl.dataset.jira);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(()=>{ prompt('Скопируйте ссылку:',url); });
    } else { prompt('Скопируйте ссылку:',url); }
    ev.stopPropagation();
    return;
  }
  // название или даты -> открыть редактор (jira берём с .grow)
  const lblHit=tgt.closest && tgt.closest('.tname, .tmeta');
  if(lblHit){
    const grow=lblHit.closest('.grow'); const code=grow&&grow.dataset.jira;
    if(code) openEditorByCode(code);
    return;
  }
  // полоса задачи -> открыть редактор
  const track=tgt.closest && tgt.closest('.track[data-code]');
  if(track) openEditorByCode(track.dataset.code);
});
document.getElementById('emCancel').addEventListener('click',closeEditor);
document.getElementById('emApply').addEventListener('click',applyEditor);
document.getElementById('editModal').addEventListener('click',function(ev){ if(ev.target===this) closeEditor(); });
document.getElementById('saveCsvBtn').addEventListener('click',saveCsv);

loadData().then(function(D){
  render(D);
}).catch(function(e){
  document.getElementById('inner').innerHTML=
    '<div style="padding:28px;color:#b5714a;font:14px system-ui">'+
    '<b>Не удалось загрузить данные.</b><br>'+
    'Проверьте, что tasks.csv и resources.csv лежат в '+
    '<code>road-map-2026/</code> ветки main.<br><br>'+
    '<span style="color:#888">'+String(e.message||e)+'</span></div>';
  console.error(e);
});
</script>
